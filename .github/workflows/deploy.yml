name: Deploy to VPS

on:
  push:
    branches:
      - main # (Change this if your main branch is called 'master')

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into server and trigger deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/html/ai-photo-filtering-system
            ./deploy.sh